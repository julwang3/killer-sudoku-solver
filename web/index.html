<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Sudoku Solver</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
    textarea { width: 100%; height: 160px; font-family: monospace; font-size: 13px; }
    button { margin-top: 8px; padding: 8px 16px; font-size: 14px; }
    pre { background: #f5f5f5; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    #status { font-size: 13px; color: #666; }
  </style>
</head>
<body>
  <h1>Sudoku Solver</h1>
  <p id="status">Loading module...</p>

  <textarea id="input">{
  "board": [
    ["5","3",".",".","7",".",".",".","."],
    ["6",".",".","1","9","5",".",".","."],
    [".","9","8",".",".",".",".","6","."],
    ["8",".",".",".","6",".",".",".","3"],
    ["4",".",".","8",".","3",".",".","1"],
    ["7",".",".",".","2",".",".",".","6"],
    [".","6",".",".",".",".","2","8","."],
    [".",".",".","4","1","9",".",".","5"],
    [".",".",".",".","8",".",".","7","9"]
  ]
}</textarea>
  <br>
  <button id="solve" disabled>Solve</button>

  <h3>Output</h3>
  <pre id="output">(nothing yet)</pre>

  <script src="build/logic.js"></script>
  <script>
    const statusEl = document.getElementById("status");
    const button = document.getElementById("solve");
    const inputEl = document.getElementById("input");
    const outputEl = document.getElementById("output");

    createModule().then((Module) => {
      statusEl.textContent = "Module loaded — ready.";
      button.disabled = false;

      button.addEventListener("click", () => {
        try {
          const inputJson = inputEl.value;
          const resultJson = Module.solveSudoku(inputJson);
          const result = JSON.parse(resultJson);
          outputEl.textContent = JSON.stringify(result, null, 2);
        } catch (e) {
          outputEl.textContent = "Error: " + e;
        }
      });
    }).catch((e) => {
      statusEl.textContent = "Failed to load module: " + e;
    });
  </script>
</body>
</html>
